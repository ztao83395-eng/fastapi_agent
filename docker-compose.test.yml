services:
  mysql-test:
    image: mysql:8.0
    container_name: news_test_mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: testpass123
      MYSQL_DATABASE: news_test
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    networks:
      - test_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-ptestpass123",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis-test:
    image: redis:7-alpine
    container_name: news_test_redis
    restart: "no"
    ports:
      - "6380:6379"
    networks:
      - test_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: news_test_app
    restart: "no"
    environment:
      MYSQL_HOST: mysql-test
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: testpass123
      MYSQL_DATABASE: news_test
      MYSQL_POOL_SIZE: 5
      MYSQL_MAX_OVERFLOW: 10
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_DB: 0
      RAG_REDIS_DB: 15
      VECTOR_STORE_DIR: /app/vector_store
      DEBUG: "false"
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      TEMPERATURE: "0.1"
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test_network
    entrypoint: ["/bin/bash", "/app/tests/test_entrypoint.sh"]

volumes:
  mysql_test_data:
    driver: local

networks:
  test_network:
    driver: bridge
