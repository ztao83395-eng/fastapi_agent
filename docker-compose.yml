services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/gcr.io/ml-pipeline/mysql:8.0.26
    container_name: news_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-123456}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --save 60 1 --loglevel warning

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - vector_store_data:/app/backend/vector_store
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_app}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
      MYSQL_MAX_OVERFLOW: ${MYSQL_MAX_OVERFLOW:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      RAG_REDIS_DB: 15
      # OpenAI chat and Agent tool calls
      GPT_API_KEY: ${GPT_API_KEY-}
      GPT_BASE_URL: ${GPT_BASE_URL-}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      REASONING_EFFORT: ${REASONING_EFFORT-}
      TEMPERATURE: ${TEMPERATURE-}
      # OpenAI embedding
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gpt-5.6-luna}
      VECTOR_COLLECTION_NAME: ${VECTOR_COLLECTION_NAME:-news_vectors_gpt}
      VECTOR_STORE_DIR: /app/backend/vector_store
      DEBUG: ${DEBUG:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  vector_store_data:
    driver: local

networks:
  app_network:
    driver: bridge
